# Тестовый Supabase reverse proxy (Timeweb VPS)
# DNS: A api-test.hockey-stars.com → IP VPS
# SSL: sudo certbot --nginx -d api-test.hockey-stars.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream supabase_origin {
    server jvsypfwiajuwsyuzkyda.supabase.co:443;
    keepalive 32;
}

server {
    listen 80;
    server_name api-test.hockey-stars.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api-test.hockey-stars.com;

    ssl_certificate     /etc/letsencrypt/live/api-test.hockey-stars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-test.hockey-stars.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location / {
        proxy_pass https://supabase_origin;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }
}
