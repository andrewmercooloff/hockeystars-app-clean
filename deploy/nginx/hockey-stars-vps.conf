# Supabase API + Expo Web static (Russia-friendly, no Railway)
# Deploy dist/ to /var/www/hockeystars-web after: npm run web:export

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 1.1.1.1 8.8.8.8 valid=30s ipv4=on ipv6=off;
resolver_timeout 5s;

# --- app.hockey-stars.com — Expo Web (static SPA) ---
server {
    listen 80;
    server_name app.hockey-stars.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.hockey-stars.com;

    ssl_certificate     /etc/letsencrypt/live/app.hockey-stars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hockey-stars.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/hockeystars-web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Expo export assets
    location /_expo/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: expo-router client-side routes (/player/uuid, /login, …)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- api.hockey-stars.com — Supabase proxy (existing) ---
server {
    listen 80;
    server_name api.hockey-stars.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.hockey-stars.com;

    ssl_certificate     /etc/letsencrypt/live/api.hockey-stars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hockey-stars.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    set $supabase_upstream "jvsypfwiajuwsyuzkyda.supabase.co";

    location /realtime/ {
        proxy_pass https://$supabase_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header Host jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass https://$supabase_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header Host jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }
}
