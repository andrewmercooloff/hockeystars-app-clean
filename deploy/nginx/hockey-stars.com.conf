# hockey-stars.com — marketing landing at / + Expo SPA + PHP SEO/auth
# Expo: /var/www/hockeystars-web | Site/PHP: /var/www/hockeystars-site

map $http_user_agent $is_seo_bot {
    default 0;
    ~*(googlebot|bingbot|yandex|duckduck|baidu|facebookexternalhit|twitterbot|linkedinbot|slackbot|telegrambot|whatsapp|applebot|petalbot|semrush) 1;
}

server {
    listen 80;
    server_name hockey-stars.com www.hockey-stars.com;
    return 301 https://hockey-stars.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.hockey-stars.com;
    ssl_certificate     /etc/letsencrypt/live/hockey-stars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hockey-stars.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://hockey-stars.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hockey-stars.com;

    ssl_certificate     /etc/letsencrypt/live/hockey-stars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hockey-stars.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    root /var/www/hockeystars-web;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/font-woff
        application/font-woff2
        application/vnd.ms-fontobject;

    # Faster static file serving for SPA/assets
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Security / performance headers for HTML responses below use add_header carefully
    # (nginx only inherits add_header from parent if location has none).

    location ^~ /.well-known/ {
        root /var/www/hockeystars-site;
        default_type application/json;
        try_files $uri =404;
    }

    # Self-hosted Leaflet (avoid unpkg/CDN latency in RU)
    location ^~ /vendor/ {
        root /var/www/hockeystars-site;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Legacy /app/* → clean SPA URLs (home feed lives at /feed; / is marketing)
    location = /app {
        return 301 /feed;
    }
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 permanent;
    }

    # Marketing promo landing (login CTA)
    location = / {
        root /var/www/hockeystars-site;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    location = /sitemap-static.xml {
        rewrite ^ /sitemap-static.php last;
    }

    location = /sitemap-players.xml {
        rewrite ^ /sitemap-players.php last;
    }

    # Localized player URLs: bots → PHP SEO, humans → Expo SPA
    location ~ ^/(ru|en|lt|lv|pl|sv|cs|sk|fi|it|de|fr)/player/([^/]+)/?$ {
        set $player_lang $1;
        set $player_key $2;
        if ($is_seo_bot = 0) {
            rewrite ^ /index.html last;
        }
        rewrite ^ /player.php?lang=$player_lang&id=$player_key last;
    }

    # Legacy /player/slug → default RU localized URL
    location ~ ^/player/([^/]+)/?$ {
        set $player_key $1;
        if ($is_seo_bot = 0) {
            rewrite ^ /index.html last;
        }
        rewrite ^ /player.php?id=$player_key last;
    }

    location = /player {
        return 301 /;
    }

    location = /top {
        root /var/www/hockeystars-site;
        add_header Cache-Control "no-cache";
        try_files /top.html =404;
    }
    location = /en {
        root /var/www/hockeystars-site;
        add_header Cache-Control "no-cache";
        try_files /index-en.html =404;
    }
    location = /welcome {
        return 301 /;
    }

    # Expo hashed bundles — long immutable cache (PageSpeed cache policy)
    location ^~ /_expo/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Expo content-hashed assets under /assets/… (except site-auth.js below)
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Site auth helper overrides Expo /assets/ prefix
    location = /assets/site-auth.js {
        root /var/www/hockeystars-site;
        add_header Cache-Control "public, max-age=86400";
        try_files /assets/site-auth.js =404;
    }

    # Marketing site static (images, fonts, css, js) — long cache
    location ~* ^/(styles\.css|script\.js|site\.webmanifest)$ {
        root /var/www/hockeystars-site;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* ^/(logo|led|favicon|apple-touch-icon|web-app-manifest-[0-9]+x[0-9]+|android-chrome-[0-9]+x[0-9]+|mstile-[0-9]+x[0-9]+|puck-avatar-[0-9]+|gilroy-regular|gilroy-bold|browserconfig)\.(png|jpe?g|webp|svg|ico|ttf|woff2?|xml)$ {
        root /var/www/hockeystars-site;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        types {
            font/ttf ttf;
            font/woff woff;
            font/woff2 woff2;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/svg+xml svg;
            image/x-icon ico;
            application/xml xml;
        }
        try_files $uri =404;
    }

    location ~* ^/(rules|privacy-en|delete-account|delete-account-en|contact|verify-consent)\.html$ {
        root /var/www/hockeystars-site;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /robots.txt {
        root /var/www/hockeystars-site;
        add_header Cache-Control "public, max-age=86400";
        try_files /robots.txt =404;
    }

    location = /get-app {
        rewrite ^ /get-app.php last;
    }

    location = /login {
        # Expo app login (ice UI); PHP backup remains at /login.php
        root /var/www/hockeystars-web;
        add_header Cache-Control "no-cache";
        try_files /login.html /index.html =404;
    }
    location = /register {
        root /var/www/hockeystars-web;
        add_header Cache-Control "no-cache";
        try_files /register.html /index.html =404;
    }

    location ^~ /api/ {
        root /var/www/hockeystars-site;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
        try_files $uri =404;
    }

    location ~ ^/(login|register|sitemap|sitemap-static|sitemap-players|player|player-bootstrap|config|get-app)\.php$ {
        root /var/www/hockeystars-site;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ \.php$ {
        root /var/www/hockeystars-site;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # SPA shell HTML — always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Other Expo static (fonts in node_modules paths etc.)
    location ~* \.(?:js|css|png|jpe?g|gif|webp|svg|ico|ttf|woff2?|mp3|m4a|mp4|json)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
