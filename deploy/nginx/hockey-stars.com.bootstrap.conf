# hockey-stars.com — bootstrap HTTP only (before DNS + certbot)
# After DNS A -> VPS: certbot --nginx -d hockey-stars.com -d www.hockey-stars.com
# Then switch to hockey-stars.com.conf (HTTPS)

server {
    listen 80;
    server_name hockey-stars.com www.hockey-stars.com;

    root /var/www/hockeystars-site;
    index index.html index.php;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location = /sitemap-players.xml {
        rewrite ^ /sitemap-players.php last;
    }

    location ~ ^/player/([^/]+)/?$ {
        rewrite ^/player/([^/]+)/?$ /player.php?id=$1 last;
    }

    location = /player { return 301 /; }
    location = /top { try_files /top.html =404; }
    location = /en { try_files /index-en.html =404; }
    location = /login {
        rewrite ^ /login.php last;
    }

    location = /register {
        rewrite ^ /register.php last;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ^~ /_expo/ {
        alias /var/www/hockeystars-web/_expo/;
    }

    location ~ ^/(messages|notifications|search|chat|exercises|admin)(/|$) {
        root /var/www/hockeystars-web;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|webmanifest)$ {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ @webapp;
    }

    location @webapp {
        root /var/www/hockeystars-web;
        try_files $uri /index.html;
    }
}
