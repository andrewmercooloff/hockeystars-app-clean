# Supabase reverse proxy (OPTIONAL — prefer Supabase Custom Domain CNAME instead)
# See deploy/SWITCH_FROM_VPS_TO_SUPABASE_CNAME.txt

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Re-resolve Supabase DNS periodically so transient DNS changes don't pin nginx
# to a stale IP (root cause of intermittent "no live upstreams" 502).
resolver 1.1.1.1 8.8.8.8 valid=30s ipv4=on ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name api.hockey-stars.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.hockey-stars.com;

    ssl_certificate     /etc/letsencrypt/live/api.hockey-stars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hockey-stars.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    # Force DNS re-resolution by using a variable in proxy_pass.
    set $supabase_upstream "jvsypfwiajuwsyuzkyda.supabase.co";

    # Browser web app on hockey-stars.com needs CORS through this proxy
    set $cors_origin "";
    if ($http_origin ~* "^https://(www\.)?hockey-stars\.com$") {
        set $cors_origin $http_origin;
    }

    location /realtime/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version,prefer,accept-profile,content-profile" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass https://$supabase_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header Host jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header Origin https://jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers "content-range,x-supabase-api-version,preference-applied" always;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version,prefer,accept-profile,content-profile" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass https://$supabase_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_set_header Host jvsypfwiajuwsyuzkyda.supabase.co;
        # Make upstream treat request as same-origin so it doesn't emit conflicting CORS
        proxy_set_header Origin https://jvsypfwiajuwsyuzkyda.supabase.co;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Supabase/PostgREST can return larger response headers on long REST URLs
        # (for example activity_points with many ids). Default 4k may produce 502.
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Expose-Headers "content-range,x-supabase-api-version,preference-applied" always;
    }
}
