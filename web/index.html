<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    
    <title>HockeyStars</title>
    
    <style>
      * {
        box-sizing: border-box;
      }
      
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      body {
        background-color: #000000;
        overflow: hidden;
      }
      
      #root {
        display: flex;
        flex: 1;
      }
      
      /* Splash Screen */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-in-out;
      }
      
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      #splash-screen img {
        width: 200px;
        height: 200px;
        object-fit: contain;
      }
      
      /* Loading indicator */
      .loading {
        color: #FF4444;
        font-size: 18px;
        margin-top: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <div style="text-align: center;">
        <img src="/assets/images/splash-icon.png" alt="HockeyStars" />
        <div class="loading">Загрузка...</div>
      </div>
    </div>
    
    <!-- App Root -->
    <div id="root"></div>
    
    <script>
      // Hide splash screen after 2 seconds or when app is ready
      setTimeout(() => {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
          splashScreen.classList.add('hidden');
          setTimeout(() => {
            splashScreen.remove();
          }, 300);
        }
      }, 2000);
    </script>
  </body>
</html>
