<!DOCTYPE html>
<html id="html-root" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Consent Verification - HockeyStars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @font-face {
            font-family: 'Gilroy';
            src: url('gilroy-regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Gilroy';
            src: url('gilroy-bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Gilroy', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('led.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: 0;
            opacity: 0.3;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(80deg, #054c76d4, #0c192ad9, #471c3ade);
            z-index: 1;
        }
        
        .container {
            position: relative;
            z-index: 2;
            background: rgba(5, 0, 8, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        .loading {
            color: #cccccc;
        }
        
        .error {
            color: #fa2f40;
        }
        
        .success {
            color: #ffffff;
        }
        
        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #fa2f40;
            margin-bottom: 20px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        p {
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .info-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .info-box p {
            color: #ffffff;
            margin: 0;
        }
        
        .info-box p:first-child {
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        a {
            color: #fa2f40;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
        }
    </style>
    <script>
        // Определяем язык СРАЗУ при загрузке страницы, до отображения контента
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            // Логика: если lang=ru в URL - русский, иначе - английский
            // Это соответствует логике Edge Function, которая передает lang в URL
            const lang = langParam === 'ru' ? 'ru' : 'en';
            
            // Устанавливаем язык для HTML элемента сразу
            document.documentElement.setAttribute('lang', lang);
            
            // Сохраняем язык в глобальной переменной для использования в основном скрипте
            window.__PAGE_LANG__ = lang;
        })();
    </script>
</head>
<body>
    <div class="container">
        <div id="loading" class="loading">
            <div class="success-icon">⏳</div>
            <h1 id="loading-title"></h1>
            <p id="loading-message"></p>
        </div>
        <div id="error" style="display: none;" class="error">
            <div class="success-icon">❌</div>
            <h1 id="error-title">Error</h1>
            <p id="error-message"></p>
        </div>
        <div id="success" style="display: none;" class="success">
            <div class="success-icon">✅</div>
            <h1 id="success-title">Consent Confirmed!</h1>
            <p id="success-message"></p>
            <div class="info-box">
                <p style="margin: 0;"><strong id="account-activated">Account Activated</strong></p>
                <p id="account-message" style="margin: 10px 0 0 0; font-size: 14px;">Your child can now log in to the HockeyStars app.</p>
            </div>
            <p id="support-message" style="font-size: 14px; color: #999;">
                If you have any questions, please contact us: <a href="mailto:support@hockey-stars.com">support@hockey-stars.com</a>
            </p>
        </div>
    </div>

    <script>
        // Используем язык, определенный в head скрипте
        // Логика: если lang=ru в URL - русский, иначе - английский
        // Это соответствует логике Edge Function:
        // - Если язык приложения русский ИЛИ страна Россия/Беларусь - lang=ru
        // - Иначе - lang=en
        const lang = window.__PAGE_LANG__ || (() => {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            return langParam === 'ru' ? 'ru' : 'en';
        })();
        
        // Локализованные тексты
        const texts = {
            ru: {
                title: 'Подтверждение согласия - HockeyStars',
                loadingTitle: 'Обработка запроса...',
                loadingMessage: 'Пожалуйста, подождите, мы подтверждаем ваше согласие.',
                errorTitle: 'Ошибка',
                errorNoToken: 'Токен не предоставлен. Пожалуйста, используйте ссылку из письма.',
                errorGeneric: 'Произошла ошибка при подтверждении согласия. Пожалуйста, попробуйте позже или свяжитесь с поддержкой.',
                successTitle: 'Согласие подтверждено!',
                accountActivated: 'Аккаунт активирован',
                accountMessage: 'Теперь ваш ребенок может войти в приложение HockeyStars.',
                supportMessage: 'Если у вас есть вопросы, свяжитесь с нами: '
            },
            en: {
                title: 'Consent Verification - HockeyStars',
                loadingTitle: 'Processing request...',
                loadingMessage: 'Please wait, we are confirming your consent.',
                errorTitle: 'Error',
                errorNoToken: 'Token not provided. Please use the link from the email.',
                errorGeneric: 'An error occurred while confirming consent. Please try again later or contact support.',
                successTitle: 'Consent Confirmed!',
                accountActivated: 'Account Activated',
                accountMessage: 'Your child can now log in to the HockeyStars app.',
                supportMessage: 'If you have any questions, please contact us: '
            }
        };
        
        const t = texts[lang];
        
        // Устанавливаем язык страницы СРАЗУ, до загрузки контента
        if (document.getElementById('html-root')) {
            document.getElementById('html-root').setAttribute('lang', lang);
        }
        if (document.getElementById('page-title')) {
            document.getElementById('page-title').textContent = t.title;
        }
        // Устанавливаем текст загрузки СРАЗУ
        const loadingTitleEl = document.getElementById('loading-title');
        const loadingMessageEl = document.getElementById('loading-message');
        if (loadingTitleEl) {
            loadingTitleEl.textContent = t.loadingTitle;
        }
        if (loadingMessageEl) {
            loadingMessageEl.textContent = t.loadingMessage;
        }
        document.getElementById('error-title').textContent = t.errorTitle;
        document.getElementById('success-title').textContent = t.successTitle;
        document.getElementById('account-activated').textContent = t.accountActivated;
        document.getElementById('account-message').textContent = t.accountMessage;
        document.getElementById('support-message').innerHTML = t.supportMessage + '<a href="mailto:support@hockey-stars.com">support@hockey-stars.com</a>';
        
        // Получаем токен из URL
        const token = urlParams.get('token');
        
        console.log('🔍 Полный URL:', window.location.href);
        console.log('🔍 Токен из URL:', token);
        console.log('🔍 Декодированный токен:', decodeURIComponent(token || ''));
        console.log('🌐 Определенный язык:', lang);

        if (!token) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error-message').textContent = t.errorNoToken;
        } else {
            // Вызываем Edge Function через fetch
            const supabaseUrl = 'https://jvsypfwiajuwsyuzkyda.supabase.co';
            const anonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2c3lwZndpYWp1d3N5dXpreWRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5OTczNTcsImV4cCI6MjA2OTU3MzM1N30.8d8k7HK7lFgIirdHzackMYRn6gGgD5OyqgOUq2rk2RM';
            
            // Правильно кодируем токен для URL
            const encodedToken = encodeURIComponent(token);
            const verifyUrl = `${supabaseUrl}/functions/v1/verify-parental-consent?token=${encodedToken}`;
            console.log('🔍 URL для запроса:', verifyUrl);
            
            fetch(verifyUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${anonKey}`,
                    'apikey': anonKey,
                }
            })
            .then(response => {
                console.log('📡 Response status:', response.status);
                console.log('📡 Response ok:', response.ok);
                console.log('📡 Response headers:', Object.fromEntries(response.headers.entries()));
                
                const contentType = response.headers.get('content-type') || '';
                console.log('📡 Content-Type:', contentType);
                
                if (response.ok) {
                    // Если это HTML, возвращаем как текст
                    if (contentType.includes('text/html')) {
                        return response.text().then(html => ({ type: 'html', content: html }));
                    }
                    // Если это JSON, парсим
                    if (contentType.includes('application/json')) {
                        return response.json().then(data => ({ type: 'json', content: data }));
                    }
                    // Иначе пробуем как текст
                    return response.text().then(text => {
                        // Проверяем, это HTML или JSON
                        if (text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
                            return { type: 'html', content: text };
                        }
                        try {
                            const data = JSON.parse(text);
                            return { type: 'json', content: data };
                        } catch (e) {
                            return { type: 'text', content: text };
                        }
                    });
                } else {
                    // Ошибка - пробуем парсить как JSON
                    return response.text().then(text => {
                        console.error('❌ Error response:', text);
                        try {
                            const errorData = JSON.parse(text);
                            throw new Error(errorData.error || errorData.message || 'Ошибка подтверждения');
                        } catch (parseError) {
                            if (parseError instanceof Error && parseError.message !== 'Ошибка подтверждения') {
                                throw parseError;
                            }
                            throw new Error(text || `HTTP ${response.status}: ${response.statusText}`);
                        }
                    });
                }
            })
            .then(result => {
                console.log('✅ Response received:', result.type);
                
                if (result.type === 'html') {
                    // Edge Function вернул HTML страницу - заменяем весь body
                    console.log('📄 Replacing body with HTML response');
                    document.body.innerHTML = result.content;
                } else if (result.type === 'json') {
                    // JSON ответ - проверяем на ошибки
                    if (result.content.error) {
                        throw new Error(result.content.error);
                    }
                    // Если успех, показываем страницу успеха
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                } else {
                    // Текстовый ответ
                    console.log('📝 Text response:', result.content);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('success').style.display = 'block';
                }
            })
            .catch(error => {
                console.error('❌ Fetch error:', error);
                console.error('❌ Error stack:', error.stack);
                
                const loadingEl = document.getElementById('loading');
                const errorEl = document.getElementById('error');
                const errorMessageEl = document.getElementById('error-message');
                
                if (loadingEl) loadingEl.style.display = 'none';
                if (errorEl) errorEl.style.display = 'block';
                if (errorMessageEl) {
                    errorMessageEl.textContent = error.message || t.errorGeneric;
                }
            });
        }
    </script>
</body>
</html>
