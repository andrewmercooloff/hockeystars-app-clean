<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Топ приглашающих | Hockey Stars</title>
    <link rel="icon" type="image/png" href="https://hockey-stars.com/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0a0a0a 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .trophy {
            font-size: 32px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .points-info {
            background: rgba(250, 47, 64, 0.1);
            border: 1px solid rgba(250, 47, 64, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .points-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .point-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .point-value {
            color: #fa2f40;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(250, 47, 64, 0.2);
            border-top-color: #fa2f40;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s, background 0.2s;
        }

        .player-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .player-card.top-1 {
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(255, 215, 0, 0.1);
        }

        .player-card.top-2 {
            border-color: rgba(192, 192, 192, 0.5);
            background: rgba(192, 192, 192, 0.1);
        }

        .player-card.top-3 {
            border-color: rgba(205, 127, 50, 0.5);
            background: rgba(205, 127, 50, 0.1);
        }

        .position {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #666;
        }

        .medal {
            font-size: 28px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .player-stats {
            font-size: 13px;
            color: #888;
        }

        .points-badge {
            background: #fa2f40;
            border-radius: 10px;
            padding: 8px 14px;
            text-align: center;
            min-width: 70px;
        }

        .points-value {
            font-size: 20px;
            font-weight: bold;
        }

        .points-label {
            font-size: 10px;
            opacity: 0.8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .refresh-btn {
            background: #fa2f40;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: #444;
            font-size: 12px;
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://hockey-stars.com/icon.png" alt="Hockey Stars" class="logo" onerror="this.style.display='none'">
            <h1><span class="trophy">🏆</span> Топ приглашающих</h1>
            <p class="subtitle">Рейтинг игроков, пригласивших больше всего друзей</p>
        </div>

        <div class="points-info">
            <div class="points-row">
                <div class="point-item">
                    <span>🏒</span>
                    <span class="point-value">+1</span>
                    <span>игрок</span>
                </div>
                <div class="point-item">
                    <span>👨‍🏫</span>
                    <span class="point-value">+5</span>
                    <span>тренер</span>
                </div>
                <div class="point-item">
                    <span>⭐</span>
                    <span class="point-value">+10</span>
                    <span>звезда</span>
                </div>
            </div>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Загрузка рейтинга...</p>
            </div>
        </div>

        <div class="footer">
            Hockey Stars © 2024
        </div>
    </div>

    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://swklaolhfahtunabahqz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3a2xhb2xoZmFodHVuYWJhaHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzE3NTUwNzYsImV4cCI6MjA0NzMzMTA3Nn0.Y3Wqt8M8k99XJuJPNbpPFpN2y74mglqTYJfLyKMVuks';

        async function loadLeaderboard() {
            const content = document.getElementById('content');
            
            try {
                // Загружаем всех игроков с invited_by
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/players?select=id,name,avatar,status,invited_by&status=neq.admin`,
                    {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }

                const players = await response.json();
                
                // Подсчитываем рефералы
                const referralMap = new Map();
                
                for (const player of players) {
                    if (player.invited_by) {
                        const inviterId = player.invited_by;
                        
                        if (!referralMap.has(inviterId)) {
                            const inviter = players.find(p => p.id === inviterId);
                            if (inviter) {
                                referralMap.set(inviterId, {
                                    id: inviterId,
                                    name: inviter.name || 'Unknown',
                                    avatar: inviter.avatar,
                                    status: inviter.status || 'player',
                                    invited_count: 0,
                                    referral_points: 0,
                                    invited_players: 0,
                                    invited_coaches: 0,
                                    invited_stars: 0
                                });
                            }
                        }
                        
                        const entry = referralMap.get(inviterId);
                        if (entry) {
                            entry.invited_count++;
                            
                            if (player.status === 'star') {
                                entry.referral_points += 10;
                                entry.invited_stars++;
                            } else if (player.status === 'coach') {
                                entry.referral_points += 5;
                                entry.invited_coaches++;
                            } else {
                                entry.referral_points += 1;
                                entry.invited_players++;
                            }
                        }
                    }
                }
                
                // Сортируем и берём топ-10
                const leaderboard = Array.from(referralMap.values())
                    .sort((a, b) => b.referral_points - a.referral_points || b.invited_count - a.invited_count)
                    .slice(0, 10);
                
                renderLeaderboard(leaderboard);
                
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                content.innerHTML = `
                    <div class="error">
                        <p>Ошибка загрузки данных</p>
                        <button class="refresh-btn" onclick="loadLeaderboard()">Попробовать снова</button>
                    </div>
                `;
            }
        }

        function renderLeaderboard(leaderboard) {
            const content = document.getElementById('content');
            
            if (leaderboard.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">👥</div>
                        <p>Пока никто не пригласил друзей</p>
                        <button class="refresh-btn" onclick="loadLeaderboard()">Обновить</button>
                    </div>
                `;
                return;
            }

            const medals = ['🥇', '🥈', '🥉'];
            
            let html = '<div class="leaderboard">';
            
            leaderboard.forEach((player, index) => {
                const topClass = index < 3 ? `top-${index + 1}` : '';
                const positionDisplay = index < 3 
                    ? `<span class="medal">${medals[index]}</span>` 
                    : `${index + 1}`;
                
                const avatarUrl = player.avatar || 'https://via.placeholder.com/56/333/fff?text=' + (player.name ? player.name[0] : '?');
                
                let statsText = `👥 ${player.invited_count}`;
                if (player.invited_stars > 0) statsText += ` • ⭐${player.invited_stars}`;
                if (player.invited_coaches > 0) statsText += ` • 👨‍🏫${player.invited_coaches}`;
                if (player.invited_players > 0) statsText += ` • 🏒${player.invited_players}`;
                
                html += `
                    <div class="player-card ${topClass}">
                        <div class="position">${positionDisplay}</div>
                        <img src="${avatarUrl}" alt="${player.name}" class="avatar" onerror="this.src='https://via.placeholder.com/56/333/fff?text=${player.name ? player.name[0] : '?'}'">
                        <div class="player-info">
                            <div class="player-name">${player.name?.toUpperCase() || 'UNKNOWN'}</div>
                            <div class="player-stats">${statsText}</div>
                        </div>
                        <div class="points-badge">
                            <div class="points-value">${player.referral_points}</div>
                            <div class="points-label">баллов</div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            html += '<div style="text-align: center; margin-top: 20px;"><button class="refresh-btn" onclick="loadLeaderboard()">🔄 Обновить</button></div>';
            
            content.innerHTML = html;
        }

        // Загружаем при открытии страницы
        loadLeaderboard();
    </script>
</body>
</html>
