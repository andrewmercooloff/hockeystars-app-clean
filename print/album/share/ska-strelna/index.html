<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>СКА Стрельна — альбом наклеек</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/andrewmercooloff/hockeystars-app-clean@cursor/ska-strelna-sticker-album-a9a3/print/album/share/ska-strelna/logo.png" type="image/png">
  <style>
    :root { --primary: #003876; --secondary: #e4002b; --text: #f8fbff; --panel: rgba(0,26,51,.92); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #001a33; color: var(--text); font-family: system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,.12); }
    header img { height: 42px; }
    header h1 { font-size: 15px; font-weight: 700; line-height: 1.2; }
    header p { font-size: 12px; opacity: .75; margin-top: 2px; }
    main { height: calc(100% - 56px); display: flex; align-items: center; justify-content: center; position: relative; }
    .page { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
    .nav { position: absolute; top: 50%; transform: translateY(-50%); border: 0; background: rgba(255,255,255,.12); color: #fff; width: 44px; height: 64px; font-size: 28px; cursor: pointer; border-radius: 8px; }
    .nav.prev { left: 8px; } .nav.next { right: 8px; }
    .nav:disabled { opacity: .25; cursor: default; }
    footer { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.45); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
    .tabs { margin-left: auto; display: flex; gap: 6px; }
    .tabs button { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer; }
    .tabs button.active { background: var(--secondary); border-color: var(--secondary); font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <img src="https://cdn.jsdelivr.net/gh/andrewmercooloff/hockeystars-app-clean@cursor/ska-strelna-sticker-album-a9a3/print/album/share/ska-strelna/logo.png" alt="СКА Стрельна">
    <div>
      <h1>Альбом наклеек СКА Стрельна</h1>
      <p>2011–2018 · макет для согласования</p>
    </div>
    <div class="tabs">
      <button id="tab-album" class="active">Альбом</button>
      <button id="tab-stickers">Наклейки</button>
    </div>
  </header>
  <main>
    <button class="nav prev" id="prev">‹</button>
    <img class="page" id="view" alt="">
    <button class="nav next" id="next">›</button>
    <footer id="counter"></footer>
  </main>
  <script>
    // raw.githubusercontent (short cache) + build stamp so a fresh build never shows stale pages
    const BASE = 'https://raw.githubusercontent.com/andrewmercooloff/hockeystars-app-clean/cursor/ska-strelna-sticker-album-a9a3/print/album/print-ready/ska-strelna/pages/';
    const BUILD = '202609260708'; // BUILD_STAMP
    const COUNTS = { album: 32, stickers: 7 }; // PAGE_COUNTS
    const sets = {
      album: Array.from({ length: COUNTS.album }, (_, i) => `${BASE}album-${String(i + 1).padStart(2, '0')}.jpg?v=${BUILD}`),
      stickers: Array.from({ length: COUNTS.stickers }, (_, i) => `${BASE}stickers-${String(i + 1).padStart(2, '0')}.jpg?v=${BUILD}`),
    };
    let mode = 'album', idx = 0;
    const view = document.getElementById('view');
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    function render() {
      const list = sets[mode];
      view.src = list[idx];
      counter.textContent = `${idx + 1} / ${list.length}`;
      prev.disabled = idx === 0;
      next.disabled = idx === list.length - 1;
    }
    prev.onclick = () => { if (idx > 0) { idx--; render(); } };
    next.onclick = () => { if (idx < sets[mode].length - 1) { idx++; render(); } };
    document.getElementById('tab-album').onclick = () => { mode = 'album'; idx = 0; document.getElementById('tab-album').classList.add('active'); document.getElementById('tab-stickers').classList.remove('active'); render(); };
    document.getElementById('tab-stickers').onclick = () => { mode = 'stickers'; idx = 0; document.getElementById('tab-stickers').classList.add('active'); document.getElementById('tab-album').classList.remove('active'); render(); };
    document.onkeydown = (e) => { if (e.key === 'ArrowLeft') prev.click(); if (e.key === 'ArrowRight') next.click(); };
    render();
  </script>
</body>
</html>
