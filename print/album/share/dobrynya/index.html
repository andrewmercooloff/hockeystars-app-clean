<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="robots" content="noindex, nofollow">
  <title>Дobrynya — альбом 2026–2027</title>
  <style>
    :root {
      color-scheme: dark;
      --orange: #f05a1a;
      --gold: #ffb347;
      --ice: #b8dff5;
      --panel: rgba(12, 28, 48, 0.78);
      --panel-border: rgba(184, 223, 245, 0.22);
      --accent: var(--orange);
      --text: #f8fbff;
      --muted: #b8cfe8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background: #0c1a2e center / cover no-repeat fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% 40%, rgba(184, 223, 245, 0.18), transparent 70%),
        linear-gradient(180deg, rgba(8, 20, 38, 0.45) 0%, rgba(12, 28, 48, 0.55) 45%, rgba(8, 16, 30, 0.72) 100%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0, 0, 0, 0.35) 100%);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    header {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: linear-gradient(180deg, rgba(14, 32, 56, 0.92), rgba(10, 24, 42, 0.82));
      border-bottom: 1px solid var(--panel-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px) saturate(1.2);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img.logo {
      height: 44px; width: auto; display: block;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.4)) drop-shadow(0 0 12px rgba(240, 90, 26, 0.25));
    }
    .brand .tagline {
      font-size: 12px; color: var(--ice); white-space: nowrap;
      text-shadow: 0 1px 8px rgba(0,0,0,.35);
    }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button {
      border: 1px solid rgba(184, 223, 245, 0.25);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }
    .tabs button.active {
      background: linear-gradient(180deg, var(--gold), var(--orange));
      border-color: var(--gold);
      color: #1a1008;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(240, 90, 26, 0.35);
    }

    .card-side {
      display: none; gap: 6px; flex: 1 1 100%; justify-content: flex-end;
    }
    .card-side.visible { display: flex; }
    .card-side button {
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: var(--text);
      padding: 4px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
    }
    .card-side button.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

    main {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px 44px;
      min-height: 0;
    }
    main.grid-mode { padding: 8px; align-items: stretch; }

    main::before {
      content: "";
      position: absolute;
      inset: 8% 10%;
      border-radius: 24px;
      background: radial-gradient(ellipse at center, rgba(184, 223, 245, 0.12) 0%, transparent 72%);
      pointer-events: none;
      z-index: 0;
    }

    .stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      min-height: 0;
      z-index: 1;
    }

    .book {
      position: relative;
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      background: #0a1018;
      cursor: zoom-in;
      border-radius: 4px;
      border: 1px solid rgba(184, 223, 245, 0.15);
      box-shadow:
        0 2px 0 rgba(255,255,255,.06) inset,
        0 28px 60px rgba(0, 0, 0, 0.55),
        0 8px 24px rgba(240, 90, 26, 0.12),
        0 0 0 1px rgba(0,0,0,.4);
      transition: transform .2s ease, box-shadow .25s ease;
    }
    .book:active {
      transform: scale(0.98) translateY(2px);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.45),
        0 4px 12px rgba(240, 90, 26, 0.1);
    }

    .book.single-mode .half { flex: 1 1 100%; border: none; }

    .half {
      flex: 1 1 50%;
      overflow: hidden;
      background: #0d1520;
      min-width: 0;
    }
    .half.left { border-right: 1px solid rgba(255,255,255,.08); }
    .half img,
    .book.spread-mode .spread-img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      user-select: none; -webkit-user-drag: none; pointer-events: none;
      background: #0d1520;
    }

    .book { transition: opacity .25s ease, transform .2s ease; }
    .book.turning { opacity: .15; }

    .cards-grid {
      display: none;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 4px;
      align-content: start;
    }
    .cards-grid.visible { display: grid; }
    .cards-grid button {
      border: 1px solid rgba(184, 223, 245, 0.2);
      padding: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.2));
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.2);
      cursor: zoom-in;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .cards-grid button:active {
      transform: scale(0.96);
      border-color: rgba(255, 179, 71, 0.55);
      box-shadow: 0 8px 22px rgba(240, 90, 26, 0.25);
    }
    .cards-grid img {
      width: 100%;
      aspect-ratio: 60 / 85;
      object-fit: cover;
      display: block;
    }
    .cards-grid .num {
      display: block;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 4px 0 6px;
    }

    .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 56px; border: 1px solid rgba(184, 223, 245, 0.25);
      border-radius: 10px;
      background: rgba(12, 28, 48, 0.88);
      color: #fff; font-size: 26px; cursor: pointer;
      z-index: 6;
      box-shadow: 0 8px 20px rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
    }
    .nav:active {
      background: linear-gradient(180deg, var(--gold), var(--orange));
      color: #1a1008;
      border-color: var(--gold);
    }
    .nav:disabled { opacity: .2; pointer-events: none; }
    .nav.prev { left: 4px; }
    .nav.next { right: 4px; }
    .nav.hidden { display: none; }

    footer {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(10, 24, 42, 0.92), rgba(14, 32, 56, 0.82));
      border-top: 1px solid var(--panel-border);
      font-size: 13px; color: var(--muted);
      backdrop-filter: blur(14px) saturate(1.15);
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.22);
    }
    .counter { color: var(--ice); font-weight: 600; text-shadow: 0 1px 6px rgba(0,0,0,.3); }

    .loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: rgba(10,22,40,.82); font-size: 14px; z-index: 10;
    }
    .loading.hidden { display: none; }
    .loading progress { width: min(220px, 70vw); accent-color: var(--accent); }

    .zoom-overlay {
      position: fixed; inset: 0; z-index: 100;
      background:
        radial-gradient(ellipse at center, rgba(184, 223, 245, 0.08), transparent 60%),
        rgba(4, 12, 24, 0.96);
      display: none; flex-direction: column;
    }
    .zoom-overlay.open { display: flex; }
    .zoom-toolbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px calc(8px + env(safe-area-inset-top));
      background: rgba(17,31,54,.95);
    }
    .zoom-toolbar span { font-size: 14px; color: var(--text); }
    .zoom-toolbar button {
      border: none; background: transparent; color: #fff;
      font-size: 28px; line-height: 1; cursor: pointer; padding: 4px 8px;
    }
    .zoom-stage {
      flex: 1 1 auto; overflow: hidden; touch-action: none; position: relative;
    }
    .zoom-stage img {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      user-select: none; -webkit-user-drag: none;
      max-height: 92vh; width: auto; height: auto;
    }
    .zoom-controls {
      flex: 0 0 auto;
      display: flex; justify-content: center; gap: 16px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(17,31,54,.95);
    }
    .zoom-controls button {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff; font-size: 22px; cursor: pointer;
    }
    .zoom-controls button:active { background: var(--accent); color: #111; }

    @media (min-width: 520px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 820px) { .cards-grid { grid-template-columns: repeat(6, 1fr); } }
    @media (max-width: 640px) {
      main { padding: 2px 30px; }
      main.grid-mode { padding: 6px; }
      .brand img.logo { height: 36px; }
      .nav { width: 28px; height: 44px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" id="logo" alt="HK «Дobrynya»">
      <span class="tagline">Альбом 2026–2027</span>
    </div>
    <div class="tabs">
      <button type="button" class="active" data-mode="spreads">Развороты</button>
      <button type="button" data-mode="pages">Страницы</button>
      <button type="button" data-mode="cards">Карточки</button>
    </div>
    <div class="card-side" id="card-side">
      <button type="button" class="active" data-side="front">Лицо</button>
      <button type="button" data-side="back">Оборот</button>
    </div>
  </header>

  <main id="main">
    <div class="loading" id="loading">
      <span id="loading-text">Загрузка альбома…</span>
      <progress id="loading-bar" max="100" value="0"></progress>
    </div>
    <button type="button" class="nav prev" id="prev" aria-label="Назад">‹</button>
    <div class="stage" id="stage">
      <div class="book spread-mode" id="book"></div>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
    <button type="button" class="nav next" id="next" aria-label="Вперёд">›</button>
  </main>

  <footer>
    <span class="counter" id="counter">—</span>
    <span id="hint">Нажмите для увеличения</span>
  </footer>

  <div class="zoom-overlay" id="zoom">
    <div class="zoom-toolbar">
      <span id="zoom-title">Просмотр</span>
      <button type="button" id="zoom-close" aria-label="Закрыть">×</button>
    </div>
    <div class="zoom-stage" id="zoom-stage">
      <img id="zoom-img" alt="">
    </div>
    <div class="zoom-controls">
      <button type="button" id="zoom-out" aria-label="Уменьшить">−</button>
      <button type="button" id="zoom-reset" aria-label="Сброс">◎</button>
      <button type="button" id="zoom-in" aria-label="Увеличить">+</button>
    </div>
  </div>

  <script>
    const VER = '20260909c';
    const REPO = 'andrewmercooloff/hockeystars-app-clean';
    const BRANCH = 'cursor/hockey-card-album-generator-a9a3';
    const CDN = `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/print/album`;
    const IMG = (file) => `${CDN}/print-ready/dobrynya/pages/${file}?v=${VER}`;
    const LOGO = `${CDN}/share/dobrynya/logo.png?v=${VER}`;
    const ICE_BG = `${CDN}/share/dobrynya/ice-bg.jpg?v=${VER}`;

    document.body.style.backgroundImage = `url("${ICE_BG}")`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.getElementById('logo').src = LOGO;
    const fav = document.createElement('link');
    fav.rel = 'icon'; fav.href = LOGO; fav.type = 'image/png';
    document.head.appendChild(fav);

    const PREVIEW = { spread: 0.62, page: 0.62, single: 0.72 };

    const albumPages = Array.from({ length: 16 }, (_, i) => IMG(`album-${String(i + 1).padStart(2, '0')}.jpg`));
    const spreadPages = Array.from({ length: 8 }, (_, i) => IMG(`spread-${String(i + 1).padStart(2, '0')}.jpg`));
    const cardFronts = Array.from({ length: 36 }, (_, i) => IMG(`card-${String(i + 1).padStart(2, '0')}-front.jpg`));
    const cardBacks = Array.from({ length: 36 }, (_, i) => IMG(`card-${String(i + 1).padStart(2, '0')}-back.jpg`));

    const modes = {
      spreads: { label: 'разворот', type: 'spread', items: spreadPages },
      pages: {
        label: 'разворот', type: 'book',
        pairs: [
          { single: 0, caption: 'Обложка' },
          { left: 1, right: 2 }, { left: 3, right: 4 }, { left: 5, right: 6 },
          { left: 7, right: 8 }, { left: 9, right: 10 }, { left: 11, right: 12 },
          { left: 13, right: 14 },
          { single: 15, caption: 'Задняя обложка' },
        ],
        urls: albumPages,
      },
      cards: { label: 'карточка', type: 'grid', count: 36 },
    };

    let mode = 'spreads';
    let index = 0;
    let cardSide = 'front';
    const cache = new Map();

    const bookEl = document.getElementById('book');
    const stageEl = document.getElementById('stage');
    const gridEl = document.getElementById('cards-grid');
    const loadingEl = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const loadingBar = document.getElementById('loading-bar');
    const counterEl = document.getElementById('counter');
    const hintEl = document.getElementById('hint');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const tabs = document.querySelectorAll('.tabs button');
    const mainEl = document.getElementById('main');
    const cardSideEl = document.getElementById('card-side');
    const cardSideBtns = document.querySelectorAll('.card-side button');
    const zoomOverlay = document.getElementById('zoom');
    const zoomImg = document.getElementById('zoom-img');
    const zoomStage = document.getElementById('zoom-stage');
    const zoomTitle = document.getElementById('zoom-title');

    let zoomScale = 1;
    let zoomPanX = 0;
    let zoomPanY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let dragStart = null;

    function cardList() { return cardSide === 'front' ? cardFronts : cardBacks; }

    function currentZoomSrc() {
      const cfg = modes[mode];
      if (cfg.type === 'grid') return cardList()[index];
      if (cfg.type === 'spread') return cfg.items[index];
      const pair = cfg.pairs[index];
      if (pair.single != null) return cfg.urls[pair.single];
      return cfg.urls[pair.right];
    }

    function loadImage(src) {
      if (cache.has(src)) return cache.get(src);
      const p = new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => resolve(src);
        img.onerror = () => reject(new Error(src));
        img.src = src;
      });
      cache.set(src, p);
      return p;
    }

    async function preloadAll(urls) {
      let done = 0;
      loadingBar.max = urls.length;
      loadingBar.value = 0;
      await Promise.all(urls.map(async (src) => {
        try { await loadImage(src); } catch (_) {}
        done += 1;
        loadingBar.value = done;
        loadingText.textContent = `Загрузка… ${done}/${urls.length}`;
      }));
    }

    function halfHtml(side, src) {
      return `<div class="half ${side}"><img src="${src}" alt="" decoding="async"></div>`;
    }

    function previewScale() {
      if (bookEl.classList.contains('single-mode')) return PREVIEW.single;
      return PREVIEW.spread;
    }

    function bookRatio() {
      if (bookEl.classList.contains('single-mode')) return 210 / 297;
      return 420 / 297;
    }

    function fitBook() {
      if (!stageEl || mode === 'cards') return;
      const pad = 4;
      const maxW = stageEl.clientWidth - pad;
      const maxH = stageEl.clientHeight - pad;
      const ratio = bookRatio();
      let w = maxW;
      let h = w / ratio;
      if (h > maxH) { h = maxH; w = h * ratio; }
      w *= previewScale();
      h *= previewScale();
      bookEl.style.width = `${Math.floor(w)}px`;
      bookEl.style.height = `${Math.floor(h)}px`;
    }

    function applyZoomTransform() {
      zoomImg.style.transform = `translate(calc(-50% + ${zoomPanX}px), calc(-50% + ${zoomPanY}px)) scale(${zoomScale})`;
    }

    function fitZoomImage() {
      zoomImg.onload = () => {
        zoomScale = 1;
        zoomPanX = 0;
        zoomPanY = 0;
        applyZoomTransform();
      };
    }

    function openZoom(cardIndex) {
      if (cardIndex != null) index = cardIndex;
      const src = currentZoomSrc();
      zoomTitle.textContent = mode === 'cards'
        ? `Карточка ${index + 1} · ${cardSide === 'front' ? 'лицо' : 'оборот'}`
        : (mode === 'spreads' ? `Разворот ${index + 1}` : `Страницы ${index + 1}`);
      zoomImg.src = src;
      fitZoomImage();
      zoomOverlay.classList.add('open');
    }

    function closeZoom() {
      zoomOverlay.classList.remove('open');
    }

    function buildCardsGrid() {
      const list = cardList();
      gridEl.innerHTML = list.map((src, i) =>
        `<button type="button" data-i="${i}" aria-label="Карточка ${i + 1}">
          <img src="${src}" alt="" loading="lazy" decoding="async">
          <span class="num">${i + 1}</span>
        </button>`
      ).join('');
      gridEl.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => openZoom(Number(btn.dataset.i)));
      });
    }

    function renderSpread(src) {
      bookEl.className = 'book spread-mode';
      bookEl.innerHTML = `<img class="spread-img" src="${src}" alt="" decoding="async">`;
      fitBook();
    }

    function renderBookPair(pair) {
      const urls = modes.pages.urls;
      if (pair.single != null) {
        bookEl.className = 'book single-mode';
        bookEl.innerHTML = halfHtml('left', urls[pair.single]);
      } else {
        bookEl.className = 'book page-mode';
        bookEl.innerHTML = halfHtml('left', urls[pair.left]) + halfHtml('right', urls[pair.right]);
      }
      fitBook();
    }

    function renderCurrent() {
      const cfg = modes[mode];
      if (cfg.type === 'grid') {
        buildCardsGrid();
        updateNav();
        return;
      }
      bookEl.classList.add('turning');
      if (cfg.type === 'spread') renderSpread(cfg.items[index]);
      else renderBookPair(cfg.pairs[index]);
      requestAnimationFrame(() => bookEl.classList.remove('turning'));
      updateNav();
    }

    function updateNav() {
      const cfg = modes[mode];
      const isGrid = cfg.type === 'grid';
      stageEl.style.display = isGrid ? 'none' : 'flex';
      gridEl.classList.toggle('visible', isGrid);
      mainEl.classList.toggle('grid-mode', isGrid);
      prevBtn.classList.toggle('hidden', isGrid);
      nextBtn.classList.toggle('hidden', isGrid);
      cardSideEl.classList.toggle('visible', isGrid);

      if (isGrid) {
        counterEl.textContent = `36 карточек · ${cardSide === 'front' ? 'лица' : 'обороты'}`;
        hintEl.textContent = 'Нажмите на карточку';
        return;
      }

      const total = cfg.type === 'book' ? cfg.pairs.length : cfg.items.length;
      const pair = cfg.type === 'book' ? cfg.pairs[index] : null;
      let detail = `${index + 1} / ${total} · ${cfg.label}`;
      if (pair) {
        if (pair.single != null) detail += ` · стр. ${pair.single + 1}`;
        else detail += ` · стр. ${pair.left + 1} и ${pair.right + 1}`;
      }
      counterEl.textContent = detail;
      hintEl.textContent = 'Нажмите для увеличения';
      prevBtn.disabled = index <= 0;
      nextBtn.disabled = index >= total - 1;
    }

    function go(delta) {
      const cfg = modes[mode];
      if (cfg.type === 'grid') return;
      const total = cfg.type === 'book' ? cfg.pairs.length : cfg.items.length;
      const next = index + delta;
      if (next < 0 || next >= total) return;
      index = next;
      renderCurrent();
    }

    async function setMode(nextMode) {
      mode = nextMode;
      index = 0;
      tabs.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === mode));
      loadingEl.classList.remove('hidden');
      let urls;
      if (mode === 'pages') urls = albumPages;
      else if (mode === 'cards') urls = cardFronts.slice(0, 6);
      else urls = modes[mode].items.slice(0, 2);
      await preloadAll(urls);
      loadingEl.classList.add('hidden');
      renderCurrent();
      if (mode === 'cards') preloadAll(cardList());
      else if (mode === 'pages') preloadAll(albumPages);
      else preloadAll(spreadPages);
    }

    bookEl.addEventListener('click', () => {
      if (mode !== 'cards') openZoom();
    });

    prevBtn.addEventListener('click', () => go(-1));
    nextBtn.addEventListener('click', () => go(1));
    tabs.forEach((btn) => btn.addEventListener('click', () => {
      if (btn.dataset.mode !== mode) setMode(btn.dataset.mode);
    }));

    cardSideBtns.forEach((btn) => btn.addEventListener('click', () => {
      cardSide = btn.dataset.side;
      cardSideBtns.forEach((b) => b.classList.toggle('active', b === btn));
      if (mode === 'cards') renderCurrent();
    }));

    document.getElementById('zoom-close').addEventListener('click', closeZoom);
    document.getElementById('zoom-in').addEventListener('click', () => {
      zoomScale = Math.min(zoomScale + 0.35, 5);
      applyZoomTransform();
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      zoomScale = Math.max(zoomScale - 0.35, 0.5);
      applyZoomTransform();
    });
    document.getElementById('zoom-reset').addEventListener('click', () => {
      zoomScale = 1; zoomPanX = 0; zoomPanY = 0;
      applyZoomTransform();
    });

    zoomStage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.hypot(dx, dy);
        pinchStartScale = zoomScale;
      } else if (e.touches.length === 1) {
        dragStart = { x: e.touches[0].clientX - zoomPanX, y: e.touches[0].clientY - zoomPanY };
      }
    }, { passive: true });

    zoomStage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        zoomScale = Math.min(5, Math.max(0.5, pinchStartScale * (Math.hypot(dx, dy) / pinchStartDist)));
        applyZoomTransform();
      } else if (e.touches.length === 1 && dragStart) {
        zoomPanX = e.touches[0].clientX - dragStart.x;
        zoomPanY = e.touches[0].clientY - dragStart.y;
        applyZoomTransform();
      }
    }, { passive: true });

    zoomStage.addEventListener('touchend', () => { dragStart = null; });

    window.addEventListener('keydown', (e) => {
      if (zoomOverlay.classList.contains('open')) {
        if (e.key === 'Escape') closeZoom();
        return;
      }
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });

    let touchX = null;
    mainEl.addEventListener('touchstart', (e) => {
      if (zoomOverlay.classList.contains('open') || mode === 'cards') return;
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    mainEl.addEventListener('touchend', (e) => {
      if (zoomOverlay.classList.contains('open') || mode === 'cards' || touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 42) go(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    window.addEventListener('resize', fitBook);
    window.addEventListener('orientationchange', () => setTimeout(fitBook, 120));

    setMode('spreads');
  </script>
</body>
</html>
