<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>HK «Дobrynya» — альбом 2026–2027</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a1628;
      --panel: #111f36;
      --accent: #f58220;
      --text: #eef3fb;
      --muted: #8fa3c0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      touch-action: pan-y;
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    header {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid rgba(255,255,255,.08);
      z-index: 5;
    }
    header h1 { font-size: 15px; font-weight: 600; line-height: 1.25; }
    header p { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button {
      border: 1px solid rgba(255,255,255,.15); background: transparent; color: var(--text);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }

    main {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px 48px;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2200px;
    }

    .book {
      position: relative;
      display: flex;
      align-items: stretch;
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
      transform-style: preserve-3d;
      background: #000;
    }

    .book.spread-mode { aspect-ratio: 420 / 297; height: min(calc(100dvh - 130px), 100%); width: auto; }
    .book.page-mode  { aspect-ratio: 420 / 297; height: min(calc(100dvh - 130px), 100%); width: auto; }

    .half {
      flex: 1 1 50%;
      position: relative;
      overflow: hidden;
      background: #0d1520;
      min-width: 0;
    }
    .half.left  { border-right: 1px solid rgba(255,255,255,.08); }
    .half img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      user-select: none; -webkit-user-drag: none; pointer-events: none;
    }
    .half.empty { background: linear-gradient(135deg, #0d1520, #162236); }

    .book.spread-mode .spread-img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      user-select: none; -webkit-user-drag: none;
    }

    .book { transition: opacity .25s ease; }
    .book.turning { opacity: .15; }

    .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 56px; border: none; border-radius: 8px;
      background: rgba(17,31,54,.9); color: #fff; font-size: 26px; cursor: pointer;
      z-index: 6;
    }
    .nav:active { background: var(--accent); color: #111; }
    .nav:disabled { opacity: .2; pointer-events: none; }
    .nav.prev { left: 4px; }
    .nav.next { right: 4px; }

    footer {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: var(--panel); border-top: 1px solid rgba(255,255,255,.08);
      font-size: 13px; color: var(--muted); z-index: 5;
    }
    .counter { color: var(--text); font-weight: 600; }

    .loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: rgba(10,22,40,.82); font-size: 14px; z-index: 10;
    }
    .loading.hidden { display: none; }
    .loading progress { width: min(220px, 70vw); accent-color: var(--accent); }

    @media (max-width: 640px) {
      main { padding: 4px 36px; }
      header { flex-wrap: wrap; }
      .nav { width: 32px; height: 48px; font-size: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>HK «Дobrynya» — альбом 2026–2027</h1>
      <p>Открытый разворот — видны левая и правая страницы</p>
    </div>
    <div class="tabs">
      <button type="button" class="active" data-mode="spreads">Развороты</button>
      <button type="button" data-mode="pages">Страницы</button>
      <button type="button" data-mode="cards">Карточки</button>
    </div>
  </header>

  <main id="main">
    <div class="loading" id="loading">
      <span id="loading-text">Загрузка альбома…</span>
      <progress id="loading-bar" max="100" value="0"></progress>
    </div>
    <button type="button" class="nav prev" id="prev" aria-label="Назад">‹</button>
    <div class="stage">
      <div class="book spread-mode" id="book"></div>
    </div>
    <button type="button" class="nav next" id="next" aria-label="Вперёд">›</button>
  </main>

  <footer>
    <span class="counter" id="counter">—</span>
    <span>Свайп или тап по краю</span>
  </footer>

  <script>
    const REPO = 'andrewmercooloff/hockeystars-app-clean';
    const BRANCH = 'cursor/hockey-card-album-generator-a9a3';
    const IMG = (file) =>
      `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/print/album/print-ready/dobrynya/pages/${file}`;

    const albumPages = Array.from({ length: 16 }, (_, i) => IMG(`album-${String(i + 1).padStart(2, '0')}.jpg`));
    const spreadPages = Array.from({ length: 8 }, (_, i) => IMG(`spread-${String(i + 1).padStart(2, '0')}.jpg`));

    const modes = {
      spreads: {
        label: 'разворот',
        type: 'spread',
        items: spreadPages,
      },
      pages: {
        label: 'разворот',
        type: 'book',
        // Пары страниц как в открытом журнале: обложка одна, дальше 2–3, 4–5 …
        pairs: [
          { left: null, right: 0, caption: 'Обложка' },
          { left: 1, right: 2 }, { left: 3, right: 4 }, { left: 5, right: 6 },
          { left: 7, right: 8 }, { left: 9, right: 10 }, { left: 11, right: 12 },
          { left: 13, right: 14 }, { left: null, right: 15, caption: 'Задняя обложка' },
        ],
        urls: albumPages,
      },
      cards: {
        label: 'лист',
        type: 'spread',
        items: [IMG('cards-all-fronts.jpg'), IMG('cards-all-backs.jpg')],
      },
    };

    let mode = 'spreads';
    let index = 0;
    const cache = new Map();

    const bookEl = document.getElementById('book');
    const loadingEl = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const loadingBar = document.getElementById('loading-bar');
    const counterEl = document.getElementById('counter');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const tabs = document.querySelectorAll('.tabs button');
    const mainEl = document.getElementById('main');

    function loadImage(src) {
      if (cache.has(src)) return cache.get(src);
      const p = new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => resolve(src);
        img.onerror = () => reject(new Error(src));
        img.src = src;
      });
      cache.set(src, p);
      return p;
    }

    async function preloadAll(urls) {
      let done = 0;
      const total = urls.length;
      loadingBar.max = total;
      loadingBar.value = 0;
      await Promise.all(urls.map(async (src) => {
        try {
          await loadImage(src);
        } catch (_) { /* покажем с broken — не блокируем весь альбом */ }
        done += 1;
        loadingBar.value = done;
        loadingText.textContent = `Загрузка… ${done}/${total}`;
      }));
    }

    function halfHtml(side, src, empty) {
      if (empty) return `<div class="half ${side} empty"></div>`;
      return `<div class="half ${side}"><img src="${src}" alt="" loading="eager" decoding="async"></div>`;
    }

    function renderSpread(src) {
      bookEl.className = 'book spread-mode';
      bookEl.innerHTML = `<img class="spread-img" src="${src}" alt="" decoding="async">`;
    }

    function renderBookPair(pair) {
      bookEl.className = 'book page-mode';
      const urls = modes.pages.urls;
      const left = pair.left == null ? null : urls[pair.left];
      const right = pair.right == null ? null : urls[pair.right];
      bookEl.innerHTML =
        halfHtml('left', left, !left) +
        halfHtml('right', right, !right);
    }

    function renderCurrent() {
      bookEl.classList.add('turning');
      const cfg = modes[mode];
      if (cfg.type === 'spread') {
        renderSpread(cfg.items[index]);
      } else {
        renderBookPair(cfg.pairs[index]);
      }
      requestAnimationFrame(() => bookEl.classList.remove('turning'));
      updateNav();
    }

    function updateNav() {
      const cfg = modes[mode];
      const total = cfg.type === 'spread' ? cfg.items.length : cfg.pairs.length;
      const n = index + 1;
      const pair = cfg.type === 'book' ? cfg.pairs[index] : null;
      let detail = `${n} / ${total} · ${cfg.label}`;
      if (pair) {
        const l = pair.left != null ? pair.left + 1 : '—';
        const r = pair.right != null ? pair.right + 1 : '—';
        detail += ` · стр. ${l} и ${r}`;
      }
      counterEl.textContent = detail;
      prevBtn.disabled = index <= 0;
      nextBtn.disabled = index >= total - 1;
    }

    function go(delta) {
      const cfg = modes[mode];
      const total = cfg.type === 'spread' ? cfg.items.length : cfg.pairs.length;
      const next = index + delta;
      if (next < 0 || next >= total) return;
      index = next;
      renderCurrent();
    }

    async function setMode(nextMode) {
      mode = nextMode;
      index = 0;
      tabs.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === mode));
      loadingEl.classList.remove('hidden');
      const urls = mode === 'pages' ? albumPages : modes[mode].items;
      await preloadAll(urls);
      loadingEl.classList.add('hidden');
      renderCurrent();
    }

    prevBtn.addEventListener('click', () => go(-1));
    nextBtn.addEventListener('click', () => go(1));
    tabs.forEach((btn) => btn.addEventListener('click', () => {
      if (btn.dataset.mode !== mode) setMode(btn.dataset.mode);
    }));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });

    let touchX = null;
    mainEl.addEventListener('touchstart', (e) => {
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    mainEl.addEventListener('touchend', (e) => {
      if (touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 42) go(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    setMode('spreads');
  </script>
</body>
</html>
