<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Дobrynya — альбом 2026–2027</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(17, 31, 54, 0.88);
      --accent: #f58220;
      --text: #eef3fb;
      --muted: #c8d6ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background: #0a1628 url("ice-bg.jpg") center / cover no-repeat fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(8, 18, 34, 0.68);
      pointer-events: none;
      z-index: 0;
    }
    body > * { position: relative; z-index: 1; }

    header {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap;
      padding: 8px 14px; background: var(--panel);
      border-bottom: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(8px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img.logo { height: 42px; width: auto; display: block; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
    .brand .tagline { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .tabs button {
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: var(--text);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }

    main {
      flex: 1 1 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 6px 44px;
      min-height: 0;
      touch-action: pan-y;
    }
    main.cards-mode { touch-action: none; }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .book {
      position: relative;
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
      background: #000;
    }

    .book.single-mode .half { flex: 1 1 100%; border: none; }

    .half {
      flex: 1 1 50%;
      position: relative;
      overflow: hidden;
      background: #0d1520;
      min-width: 0;
    }
    .half.left { border-right: 1px solid rgba(255,255,255,.08); }
    .half img,
    .book.spread-mode .spread-img,
    .book.card-mode .card-img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      user-select: none; -webkit-user-drag: none;
      background: #0d1520;
    }

    .book { transition: opacity .25s ease; }
    .book.turning { opacity: .15; }

    .card-side {
      display: none;
      gap: 6px;
      margin-top: 6px;
    }
    .card-side.visible { display: flex; }
    .card-side button {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
    }
    .card-side button.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }

    .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 40px; height: 56px; border: none; border-radius: 8px;
      background: rgba(17,31,54,.9); color: #fff; font-size: 26px; cursor: pointer;
      z-index: 6;
    }
    .nav:active { background: var(--accent); color: #111; }
    .nav:disabled { opacity: .2; pointer-events: none; }
    .nav.prev { left: 4px; }
    .nav.next { right: 4px; }

    .zoom-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 46px; height: 46px;
      border: none; border-radius: 50%;
      background: rgba(17,31,54,.92);
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,.35);
      cursor: pointer;
      z-index: 7;
      display: none;
    }
    .zoom-btn.visible { display: block; }
    .zoom-btn:active { background: var(--accent); color: #111; }

    footer {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      background: var(--panel);
      border-top: 1px solid rgba(255,255,255,.1);
      font-size: 13px; color: var(--muted);
      backdrop-filter: blur(8px);
    }
    .counter { color: var(--text); font-weight: 600; }

    .loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      background: rgba(10,22,40,.82); font-size: 14px; z-index: 10;
    }
    .loading.hidden { display: none; }
    .loading progress { width: min(220px, 70vw); accent-color: var(--accent); }

    .zoom-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.92);
      display: none;
      flex-direction: column;
    }
    .zoom-overlay.open { display: flex; }
    .zoom-toolbar {
      flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px calc(8px + env(safe-area-inset-top));
      background: rgba(17,31,54,.95);
    }
    .zoom-toolbar span { font-size: 14px; color: var(--text); }
    .zoom-toolbar button {
      border: none; background: transparent; color: #fff;
      font-size: 28px; line-height: 1; cursor: pointer; padding: 4px 8px;
    }
    .zoom-stage {
      flex: 1 1 auto;
      overflow: hidden;
      touch-action: none;
      position: relative;
    }
    .zoom-stage img {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      max-width: none;
      max-height: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .zoom-controls {
      flex: 0 0 auto;
      display: flex; justify-content: center; gap: 16px;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(17,31,54,.95);
    }
    .zoom-controls button {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: #fff; font-size: 22px; cursor: pointer;
    }
    .zoom-controls button:active { background: var(--accent); color: #111; }

    @media (max-width: 640px) {
      main { padding: 2px 30px; }
      header { flex-wrap: wrap; }
      .brand img.logo { height: 36px; }
      .nav { width: 28px; height: 44px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo" src="logo.png" alt="HK «Дobrynya»">
      <span class="tagline">Альбом 2026–2027</span>
    </div>
    <div class="tabs">
      <button type="button" class="active" data-mode="spreads">Развороты</button>
      <button type="button" data-mode="pages">Страницы</button>
      <button type="button" data-mode="cards">Карточки</button>
    </div>
    <div class="card-side" id="card-side">
      <button type="button" class="active" data-side="front">Лицо</button>
      <button type="button" data-side="back">Оборот</button>
    </div>
  </header>

  <main id="main">
    <div class="loading" id="loading">
      <span id="loading-text">Загрузка альбома…</span>
      <progress id="loading-bar" max="100" value="0"></progress>
    </div>
    <button type="button" class="nav prev" id="prev" aria-label="Назад">‹</button>
    <div class="stage">
      <div class="book spread-mode" id="book"></div>
    </div>
    <button type="button" class="nav next" id="next" aria-label="Вперёд">›</button>
    <button type="button" class="zoom-btn" id="zoom-open" aria-label="Увеличить" title="Лупа">🔍</button>
  </main>

  <footer>
    <span class="counter" id="counter">—</span>
    <span id="hint">Свайп или тап по краю</span>
  </footer>

  <div class="zoom-overlay" id="zoom">
    <div class="zoom-toolbar">
      <span id="zoom-title">Карточка</span>
      <button type="button" id="zoom-close" aria-label="Закрыть">×</button>
    </div>
    <div class="zoom-stage" id="zoom-stage">
      <img id="zoom-img" alt="">
    </div>
    <div class="zoom-controls">
      <button type="button" id="zoom-out" aria-label="Уменьшить">−</button>
      <button type="button" id="zoom-reset" aria-label="Сброс">◎</button>
      <button type="button" id="zoom-in" aria-label="Увеличить">+</button>
    </div>
  </div>

  <script>
    const REPO = 'andrewmercooloff/hockeystars-app-clean';
    const BRANCH = 'cursor/hockey-card-album-generator-a9a3';
    const IMG = (file) =>
      `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/print/album/print-ready/dobrynya/pages/${file}`;

    const albumPages = Array.from({ length: 16 }, (_, i) => IMG(`album-${String(i + 1).padStart(2, '0')}.jpg`));
    const spreadPages = Array.from({ length: 8 }, (_, i) => IMG(`spread-${String(i + 1).padStart(2, '0')}.jpg`));
    const cardFronts = Array.from({ length: 36 }, (_, i) => IMG(`card-${String(i + 1).padStart(2, '0')}-front.jpg`));
    const cardBacks = Array.from({ length: 36 }, (_, i) => IMG(`card-${String(i + 1).padStart(2, '0')}-back.jpg`));

    const modes = {
      spreads: { label: 'разворот', type: 'spread', items: spreadPages },
      pages: {
        label: 'разворот',
        type: 'book',
        pairs: [
          { single: 0, caption: 'Обложка' },
          { left: 1, right: 2 }, { left: 3, right: 4 }, { left: 5, right: 6 },
          { left: 7, right: 8 }, { left: 9, right: 10 }, { left: 11, right: 12 },
          { left: 13, right: 14 },
          { single: 15, caption: 'Задняя обложка' },
        ],
        urls: albumPages,
      },
      cards: { label: 'карточка', type: 'card', count: 36 },
    };

    let mode = 'spreads';
    let index = 0;
    let cardSide = 'front';
    const cache = new Map();

    const bookEl = document.getElementById('book');
    const stageEl = document.querySelector('.stage');
    const loadingEl = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const loadingBar = document.getElementById('loading-bar');
    const counterEl = document.getElementById('counter');
    const hintEl = document.getElementById('hint');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const tabs = document.querySelectorAll('.tabs button');
    const mainEl = document.getElementById('main');
    const cardSideEl = document.getElementById('card-side');
    const cardSideBtns = document.querySelectorAll('.card-side button');
    const zoomOpenBtn = document.getElementById('zoom-open');
    const zoomOverlay = document.getElementById('zoom');
    const zoomImg = document.getElementById('zoom-img');
    const zoomStage = document.getElementById('zoom-stage');
    const zoomTitle = document.getElementById('zoom-title');

    let zoomScale = 1;
    let zoomPanX = 0;
    let zoomPanY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let dragStart = null;

    function currentCardSrc() {
      const list = cardSide === 'front' ? cardFronts : cardBacks;
      return list[index];
    }

    function currentZoomSrc() {
      const cfg = modes[mode];
      if (cfg.type === 'card') return currentCardSrc();
      if (cfg.type === 'spread') return cfg.items[index];
      const pair = cfg.pairs[index];
      if (pair.single != null) return cfg.urls[pair.single];
      return cfg.urls[pair.right];
    }

    function loadImage(src) {
      if (cache.has(src)) return cache.get(src);
      const p = new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => resolve(src);
        img.onerror = () => reject(new Error(src));
        img.src = src;
      });
      cache.set(src, p);
      return p;
    }

    async function preloadAll(urls) {
      let done = 0;
      const total = urls.length;
      loadingBar.max = total;
      loadingBar.value = 0;
      await Promise.all(urls.map(async (src) => {
        try { await loadImage(src); } catch (_) {}
        done += 1;
        loadingBar.value = done;
        loadingText.textContent = `Загрузка… ${done}/${total}`;
      }));
    }

    function halfHtml(side, src) {
      return `<div class="half ${side}"><img src="${src}" alt="" loading="eager" decoding="async"></div>`;
    }

    function bookRatio() {
      if (bookEl.classList.contains('single-mode') || bookEl.classList.contains('card-mode')) return 60 / 85;
      return 420 / 297;
    }

    function fitBook() {
      if (!stageEl) return;
      const pad = 4;
      const maxW = stageEl.clientWidth - pad;
      const maxH = stageEl.clientHeight - pad;
      const ratio = bookRatio();
      let w = maxW;
      let h = w / ratio;
      if (h > maxH) { h = maxH; w = h * ratio; }
      bookEl.style.width = `${Math.floor(w)}px`;
      bookEl.style.height = `${Math.floor(h)}px`;
    }

    function applyZoomTransform() {
      zoomImg.style.transform = `translate(calc(-50% + ${zoomPanX}px), calc(-50% + ${zoomPanY}px)) scale(${zoomScale})`;
    }

    function openZoom() {
      const src = currentZoomSrc();
      zoomTitle.textContent = mode === 'cards'
        ? `Карточка ${index + 1} · ${cardSide === 'front' ? 'лицо' : 'оборот'}`
        : 'Увеличение';
      zoomImg.src = src;
      zoomScale = mode === 'cards' ? 1.8 : 1.2;
      zoomPanX = 0;
      zoomPanY = 0;
      applyZoomTransform();
      zoomOverlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeZoom() {
      zoomOverlay.classList.remove('open');
      document.body.style.overflow = '';
    }

    function renderSpread(src) {
      bookEl.className = 'book spread-mode';
      bookEl.innerHTML = `<img class="spread-img" src="${src}" alt="" decoding="async">`;
      fitBook();
    }

    function renderCard() {
      bookEl.className = 'book card-mode';
      bookEl.innerHTML = `<img class="card-img" src="${currentCardSrc()}" alt="" decoding="async">`;
      fitBook();
    }

    function renderBookPair(pair) {
      const urls = modes.pages.urls;
      if (pair.single != null) {
        bookEl.className = 'book single-mode';
        bookEl.innerHTML = halfHtml('left', urls[pair.single]);
      } else {
        bookEl.className = 'book page-mode';
        bookEl.innerHTML = halfHtml('left', urls[pair.left]) + halfHtml('right', urls[pair.right]);
      }
      fitBook();
    }

    function renderCurrent() {
      bookEl.classList.add('turning');
      const cfg = modes[mode];
      if (cfg.type === 'spread') renderSpread(cfg.items[index]);
      else if (cfg.type === 'card') renderCard();
      else renderBookPair(cfg.pairs[index]);
      requestAnimationFrame(() => bookEl.classList.remove('turning'));
      updateNav();
    }

    function updateNav() {
      const cfg = modes[mode];
      const total = cfg.type === 'book' ? cfg.pairs.length : (cfg.type === 'card' ? cfg.count : cfg.items.length);
      const n = index + 1;
      const pair = cfg.type === 'book' ? cfg.pairs[index] : null;
      let detail = `${n} / ${total} · ${cfg.label}`;
      if (pair) {
        if (pair.single != null) detail += ` · стр. ${pair.single + 1}`;
        else detail += ` · стр. ${pair.left + 1} и ${pair.right + 1}`;
      }
      counterEl.textContent = detail;

      const cardsActive = mode === 'cards';
      cardSideEl.classList.toggle('visible', cardsActive);
      mainEl.classList.toggle('cards-mode', cardsActive);
      zoomOpenBtn.classList.toggle('visible', cardsActive);
      hintEl.textContent = cardsActive ? 'Свайп · 🔍 лупа · двойной тап' : 'Свайп или тап по краю';

      prevBtn.disabled = index <= 0;
      nextBtn.disabled = index >= total - 1;
    }

    function go(delta) {
      const cfg = modes[mode];
      const total = cfg.type === 'book' ? cfg.pairs.length : (cfg.type === 'card' ? cfg.count : cfg.items.length);
      const next = index + delta;
      if (next < 0 || next >= total) return;
      index = next;
      renderCurrent();
    }

    async function setMode(nextMode) {
      mode = nextMode;
      index = 0;
      tabs.forEach((btn) => btn.classList.toggle('active', btn.dataset.mode === mode));
      loadingEl.classList.remove('hidden');
      let urls;
      if (mode === 'pages') urls = albumPages;
      else if (mode === 'cards') urls = cardFronts.concat(cardBacks);
      else urls = modes[mode].items;
      await preloadAll(urls);
      loadingEl.classList.add('hidden');
      renderCurrent();
    }

    prevBtn.addEventListener('click', () => go(-1));
    nextBtn.addEventListener('click', () => go(1));
    tabs.forEach((btn) => btn.addEventListener('click', () => {
      if (btn.dataset.mode !== mode) setMode(btn.dataset.mode);
    }));

    cardSideBtns.forEach((btn) => btn.addEventListener('click', () => {
      cardSide = btn.dataset.side;
      cardSideBtns.forEach((b) => b.classList.toggle('active', b === btn));
      if (mode === 'cards') renderCurrent();
    }));

    zoomOpenBtn.addEventListener('click', openZoom);
    document.getElementById('zoom-close').addEventListener('click', closeZoom);
    document.getElementById('zoom-in').addEventListener('click', () => {
      zoomScale = Math.min(zoomScale + 0.35, 6);
      applyZoomTransform();
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      zoomScale = Math.max(zoomScale - 0.35, 0.6);
      applyZoomTransform();
    });
    document.getElementById('zoom-reset').addEventListener('click', () => {
      zoomScale = mode === 'cards' ? 1.8 : 1.2;
      zoomPanX = 0;
      zoomPanY = 0;
      applyZoomTransform();
    });

    zoomStage.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStartDist = Math.hypot(dx, dy);
        pinchStartScale = zoomScale;
      } else if (e.touches.length === 1) {
        dragStart = { x: e.touches[0].clientX - zoomPanX, y: e.touches[0].clientY - zoomPanY };
      }
    }, { passive: true });

    zoomStage.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        zoomScale = Math.min(6, Math.max(0.6, pinchStartScale * (dist / pinchStartDist)));
        applyZoomTransform();
      } else if (e.touches.length === 1 && dragStart) {
        zoomPanX = e.touches[0].clientX - dragStart.x;
        zoomPanY = e.touches[0].clientY - dragStart.y;
        applyZoomTransform();
      }
    }, { passive: true });

    zoomStage.addEventListener('touchend', () => { dragStart = null; });

    let lastTap = 0;
    bookEl.addEventListener('click', () => {
      if (mode !== 'cards') return;
      const now = Date.now();
      if (now - lastTap < 320) openZoom();
      lastTap = now;
    });

    window.addEventListener('keydown', (e) => {
      if (zoomOverlay.classList.contains('open')) {
        if (e.key === 'Escape') closeZoom();
        return;
      }
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });

    let touchX = null;
    mainEl.addEventListener('touchstart', (e) => {
      if (zoomOverlay.classList.contains('open')) return;
      touchX = e.changedTouches[0].clientX;
    }, { passive: true });
    mainEl.addEventListener('touchend', (e) => {
      if (zoomOverlay.classList.contains('open') || touchX == null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 42) go(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    window.addEventListener('resize', fitBook);
    window.addEventListener('orientationchange', () => setTimeout(fitBook, 120));

    setMode('spreads');
  </script>
</body>
</html>
